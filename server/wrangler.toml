# Retro Hoops Live backend (Cloudflare Workers + D1). See README.md for setup.
name = "retrohoops-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "retrohoops"
# Paste the id printed by `npx wrangler d1 create retrohoops` here:
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[vars]
BUNDLE_ID = "com.phoronomicstudios.retrohoops"
PRODUCT_ID = "com.phoronomicstudios.retrohoops.live.monthly"
# "sandbox" while testing with TestFlight / sandbox testers, "production" after release.
APPLE_ENV = "sandbox"

# Settle Live games whose second report never came (every 10 minutes).
[triggers]
crons = ["*/10 * * * *"]

# Secrets (never in this file). Set each with: npx wrangler secret put NAME
#   SESSION_SECRET      long random string (e.g. `openssl rand -base64 48`)
#   APPLE_ISSUER_ID     App Store Connect ▸ Users and Access ▸ Integrations ▸ In-App Purchase: Issuer ID
#   APPLE_KEY_ID        the In-App Purchase key's Key ID
#   APPLE_PRIVATE_KEY   the contents of the downloaded SubscriptionKey_XXXX.p8 file
